name: Build Android APK & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug & Signed Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Prepare Release Assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/InkPulse-v1.0.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/InkPulse-v1.0.0-debug.apk
          ls -lh dist/

      - name: Upload APK Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InkPulse-APKs
          path: dist/*.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "InkPulse v1.0.0 — Offline Creator Blog & Community App"
          body: |
            ### InkPulse v1.0.0 (First Android Release)
            Offline-first Android app for **Creators** to write/manage blogs and **Community Users** to publish content, stories, and comments.

            #### Included in this Release:
            - **`InkPulse-v1.0.0-release.apk`**: Signed release APK ready to install on any Android 8.0+ (API 26+) device.
            - **`InkPulse-v1.0.0-debug.apk`**: Debug build (can be installed alongside release).

            #### Key Features to Test:
            - **One-Tap Demo Logins**: Instantly sign in as **Creator** (`@waguri_creator`, `@elena_editorial`) or **Community Writer** (`@samira_writes`, `@liam_tinkerer`), or create a custom offline account.
            - **Creator Blog Studio**: Markdown snippet bar, cover color picker, featured carousel pinning, offline drafts, and studio analytics.
            - **Community Content Hub**: Users can write stories, tips, discussions, bookmark blogs, like posts, and leave offline comments.
            - **100% Offline SQLite Engine**: Powered by local `inkpulse_offline.db` with an in-app Database Inspector & 1-tap Demo DB Reset.
          files: |
            dist/InkPulse-v1.0.0-release.apk
            dist/InkPulse-v1.0.0-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
